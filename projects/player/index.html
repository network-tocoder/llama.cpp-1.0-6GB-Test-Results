<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glassmorphism Music Player</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

  :root{
    --card-bg:rgba(255,255,255,.08);
    --card-border:rgba(255,255,255,.18);
    --card-shadow:0 8px 32px rgba(0,0,0,.35);
    --text-primary:#f0f0f5;
    --text-secondary:rgba(240,240,245,.55);
    --accent:#a78bfa;
    --progress-bg:rgba(255,255,255,.1);
    --bar-radius:3px;
  }

  html,body{height:100%;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#0a0a1a;color:var(--text-primary);overflow:hidden}

  /* ── animated blobs ─────────────────────────────────── */
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden}
  .blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;will-change:transform}
  .blob--pink{width:420px;height:420px;background:#ec4899;top:10%;left:15%;animation:drift-p 18s ease-in-out infinite alternate}
  .blob--blue{width:380px;height:380px;background:#3b82f6;bottom:10%;right:10%;animation:drift-b 22s ease-in-out infinite alternate}
  .blob--violet{width:340px;height:340px;background:#8b5cf6;top:55%;left:55%;animation:drift-v 20s ease-in-out infinite alternate}

  @keyframes drift-p{0%{transform:translate(0,0) scale(1)}100%{transform:translate(80px,60px) scale(1.15)}}
  @keyframes drift-b{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-70px,-50px) scale(1.1)}}
  @keyframes drift-v{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-90px,40px) scale(1.2)}}

  /* ── player card ────────────────────────────────────── */
  .player-wrap{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;height:100%;padding:20px}

  .card{
    width:min(420px,92vw);
    background:var(--card-bg);
    backdrop-filter:blur(24px) saturate(1.4);
    -webkit-backdrop-filter:blur(24px) saturate(1.4);
    border:1px solid var(--card-border);
    border-radius:28px;
    box-shadow:var(--card-shadow);
    padding:32px 28px 28px;
    display:flex;flex-direction:column;gap:22px;
    transition:box-shadow .4s;
  }
  .card:hover{box-shadow:0 12px 48px rgba(0,0,0,.45)}

  /* ── album art ──────────────────────────────────────── */
  .album{
    width:100%;aspect-ratio:1;border-radius:18px;
    background:linear-gradient(135deg,#ec4899,#3b82f6,#8b5cf6,#06b6d4);
    background-size:400% 400%;
    animation:album-shift 8s ease-in-out infinite alternate;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 20px rgba(0,0,0,.3);
    position:relative;overflow:hidden;
    transition:background .6s;
  }
  .album::after{
    content:'';position:absolute;inset:0;
    background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.18),transparent 60%);
    border-radius:inherit;pointer-events:none;
  }
  @keyframes album-shift{
    0%{background-position:0% 50%}
    100%{background-position:100% 50%}
  }

  /* vinyl ring on album */
  .album::before{
    content:'';position:absolute;
    width:40%;height:40%;border-radius:50%;
    border:2px solid rgba(255,255,255,.15);
    box-shadow:inset 0 0 20px rgba(0,0,0,.2);
    transition:opacity .3s;
  }

  /* ── song info ──────────────────────────────────────── */
  .info{text-align:center}
  .info__title{font-size:1.25rem;font-weight:700;letter-spacing:.3px;margin-bottom:4px;transition:color .4s}
  .info__artist{font-size:.9rem;color:var(--text-secondary);transition:color .4s}

  /* ── progress ───────────────────────────────────────── */
  .progress{display:flex;flex-direction:column;gap:6px}
  .progress__bar{
    width:100%;height:5px;border-radius:4px;
    background:var(--progress-bg);cursor:pointer;position:relative;overflow:hidden;
  }
  .progress__fill{
    height:100%;width:0%;border-radius:4px;
    background:var(--accent);
    transition:background .4s;
    will-change:width;
  }
  .progress__time{display:flex;justify-content:space-between;font-size:.72rem;color:var(--text-secondary)}

  /* ── controls ───────────────────────────────────────── */
  .controls{display:flex;align-items:center;justify-content:center;gap:18px}
  .btn{
    background:none;border:none;color:var(--text-primary);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform .2s,color .2s,opacity .2s;
    outline:none;
  }
  .btn:hover{transform:scale(1.12);color:var(--accent)}
  .btn:active{transform:scale(.95)}
  .btn--skip{width:42px;height:42px;opacity:.75}
  .btn--play{width:56px;height:56px;border-radius:50%;background:var(--accent);opacity:1;box-shadow:0 2px 16px rgba(167,139,250,.45)}
  .btn--play:hover{box-shadow:0 4px 24px rgba(167,139,250,.6)}
  .btn svg{width:24px;height:24px;fill:currentColor;transition:transform .25s}
  .btn--play svg{width:26px;height:26px}
  .btn--play .icon-pause{animation:icon-pop .25s ease-out}
  @keyframes icon-pop{0%{transform:scale(.5)}100%{transform:scale(1)}}

  /* ── equaliser ──────────────────────────────────────── */
  .eq{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:44px;padding:4px 0}
  .eq__bar{
    flex:1;max-width:14px;border-radius:3px;
    background:linear-gradient(to top,var(--accent),#67e8f9);
    transition:height .1s;
    will-change:height;
  }
  .eq__bar--idle{background:linear-gradient(to top,rgba(255,255,255,.12),rgba(255,255,255,.06))}

  /* ── queue ──────────────────────────────────────────── */
  .queue{display:flex;flex-direction:column;gap:6px}
  .queue__title{font-size:.7rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-secondary);margin-bottom:2px}
  .queue__item{
    display:flex;align-items:center;gap:12px;
    padding:10px 14px;border-radius:12px;cursor:pointer;
    background:rgba(255,255,255,.04);
    border:1px solid transparent;
    transition:background .2s,border-color .2s,transform .15s;
  }
  .queue__item:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.1)}
  .queue__item:active{transform:scale(.97)}
  .queue__item--active{background:rgba(167,139,250,.12);border-color:rgba(167,139,250,.25)}
  .queue__thumb{
    width:40px;height:40px;border-radius:8px;flex-shrink:0;
    background:linear-gradient(135deg,#ec4899,#3b82f6);
    transition:background .4s;
  }
  .queue__item--active .queue__thumb{box-shadow:0 0 12px rgba(167,139,250,.5)}
  .queue__meta{display:flex;flex-direction:column;gap:2px;min-width:0}
  .queue__meta-title{font-size:.85rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .queue__meta-artist{font-size:.72rem;color:var(--text-secondary)}
  .queue__item--active .queue__meta-title{color:var(--accent)}
  .queue__duration{font-size:.72rem;color:var(--text-secondary);margin-left:auto;flex-shrink:0}

  /* ── responsive ─────────────────────────────────────── */
  @media(max-width:440px){
    .card{padding:24px 18px 22px;border-radius:22px}
    .btn--play{width:48px;height:48px}
    .btn--skip{width:36px;height:36px}
    .eq{height:36px}
  }
  @media(min-height:800px){
    .card{padding:40px 34px 36px;gap:26px}
  }
</style>
</head>
<body>

<!-- Background blobs -->
<div class="bg" aria-hidden="true">
  <div class="blob blob--pink"></div>
  <div class="blob blob--blue"></div>
  <div class="blob blob--violet"></div>
</div>

<!-- Player -->
<div class="player-wrap">
  <div class="card" role="region" aria-label="Music player">

    <!-- Album art -->
    <div class="album" id="album"></div>

    <!-- Song info -->
    <div class="info">
      <div class="info__title" id="title">Midnight Signal</div>
      <div class="info__artist" id="artist">Nova Lane</div>
    </div>

    <!-- Progress -->
    <div class="progress">
      <div class="progress__bar" id="progressBar" role="slider" aria-label="Progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="progress__fill" id="progressFill"></div>
      </div>
      <div class="progress__time">
        <span id="timeCurrent">0:00</span>
        <span id="timeTotal">3:42</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="btn btn--skip" id="prevBtn" aria-label="Previous">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button class="btn btn--play" id="playBtn" aria-label="Play">
        <svg id="iconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="iconPause" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6zm8 14h4V5h-4z"/></svg>
      </button>
      <button class="btn btn--skip" id="nextBtn" aria-label="Next">
        <svg viewBox="0 0 24 24"><path d="M16 18h2V6h-2zM6 18l8.5-6L6 6z"/></svg>
      </button>
    </div>

    <!-- Equaliser -->
    <div class="eq" id="eq" aria-hidden="true"></div>

    <!-- Queue -->
    <div class="queue">
      <div class="queue__title">Up Next</div>
      <div id="queueList"></div>
    </div>

  </div>
</div>

<script>
(function(){
  "use strict";

  /* ── song data ─────────────────────────────────────── */
  var songs = [
    {
      title:"Midnight Signal",
      artist:"Nova Lane",
      total:222,
      gradient:"linear-gradient(135deg,#ec4899,#3b82f6,#8b5cf6,#06b6d4)",
      color:"#a78bfa"
    },
    {
      title:"Velvet Horizon",
      artist:"Aria Chen",
      total:198,
      gradient:"linear-gradient(135deg,#f59e0b,#ef4444,#ec4899,#8b5cf6)",
      color:"#f59e0b"
    },
    {
      title:"Crystal Frequencies",
      artist:"Echo Prism",
      total:264,
      gradient:"linear-gradient(135deg,#06b6d4,#3b82f6,#8b5cf6,#d946ef)",
      color:"#06b6d4"
    }
  ];

  var idx = 0;
  var playing = false;
  var currentSec = 0;
  var timer = null;
  var eqRAF = null;

  /* ── DOM refs ──────────────────────────────────────── */
  var $title = document.getElementById("title");
  var $artist = document.getElementById("artist");
  var $album = document.getElementById("album");
  var $fill = document.getElementById("progressFill");
  var $tCur = document.getElementById("timeCurrent");
  var $tTot = document.getElementById("timeTotal");
  var $prog = document.getElementById("progressBar");
  var $playBtn = document.getElementById("playBtn");
  var $iconPlay = document.getElementById("iconPlay");
  var $iconPause = document.getElementById("iconPause");
  var $eq = document.getElementById("eq");
  var $queueList = document.getElementById("queueList");

  /* ── helpers ───────────────────────────────────────── */
  function fmt(sec){
    var m = Math.floor(sec/60);
    var s = Math.floor(sec%60);
    return m + ":" + (s<10?"0":"") + s;
  }

  function setSong(i){
    idx = i;
    var s = songs[i];
    currentSec = 0;
    $title.textContent = s.title;
    $artist.textContent = s.artist;
    $album.style.background = s.gradient;
    $fill.style.background = s.color;
    document.documentElement.style.setProperty("--accent", s.color);
    $tTot.textContent = fmt(s.total);
    $tCur.textContent = "0:00";
    $fill.style.width = "0%";
    $prog.setAttribute("aria-valuenow","0");
    renderQueue();
  }

  function renderQueue(){
    $queueList.innerHTML = "";
    songs.forEach(function(s,i){
      var item = document.createElement("div");
      item.className = "queue__item" + (i===idx?" queue__item--active":"");
      item.setAttribute("role","button");
      item.setAttribute("tabindex","0");
      item.setAttribute("aria-label", s.title + " by " + s.artist);
      item.innerHTML =
        '<div class="queue__thumb" style="background:'+s.gradient+'"></div>' +
        '<div class="queue__meta">' +
          '<div class="queue__meta-title">'+s.title+'</div>' +
          '<div class="queue__meta-artist">'+s.artist+'</div>' +
        '</div>' +
        '<div class="queue__duration">'+fmt(s.total)+'</div>';
      item.addEventListener("click", function(){ setSong(i); play(); });
      item.addEventListener("keydown", function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); setSong(i); play(); }});
      $queueList.appendChild(item);
    });
  }

  /* ── play / pause ──────────────────────────────────── */
  function play(){
    if(playing) return;
    playing = true;
    $iconPlay.style.display = "none";
    $iconPause.style.display = "block";
    $iconPause.classList.remove("icon-pause");
    void $iconPause.offsetWidth;
    $iconPause.classList.add("icon-pause");
    $playBtn.setAttribute("aria-label","Pause");
    startTimer();
    startEq();
  }

  function pause(){
    if(!playing) return;
    playing = false;
    $iconPlay.style.display = "block";
    $iconPause.style.display = "none";
    $playBtn.setAttribute("aria-label","Play");
    stopTimer();
    stopEq();
  }

  function toggle(){ playing ? pause() : play(); }

  function startTimer(){
    stopTimer();
    timer = setInterval(function(){
      var s = songs[idx];
      currentSec++;
      if(currentSec >= s.total){
        currentSec = 0;
        if(idx < songs.length - 1) setSong(idx + 1);
        else setSong(0);
      }
      var pct = (currentSec / s.total * 100).toFixed(2);
      $fill.style.width = pct + "%";
      $tCur.textContent = fmt(currentSec);
      $prog.setAttribute("aria-valuenow", pct);
    }, 1000);
  }

  function stopTimer(){ if(timer){ clearInterval(timer); timer = null; }}

  /* ── equaliser bars ────────────────────────────────── */
  var NUM_BARS = 24;
  var bars = [];
  var freqs = [];
  var amps = [];
  var phases = [];

  function initEq(){
    $eq.innerHTML = "";
    bars = [];
    for(var i = 0; i < NUM_BARS; i++){
      var bar = document.createElement("div");
      bar.className = "eq__bar eq__bar--idle";
      bar.style.height = "4px";
      $eq.appendChild(bar);
      bars.push(bar);
      freqs.push(0.4 + Math.random() * 1.6);
      amps.push(6 + Math.random() * 30);
      phases.push(Math.random() * Math.PI * 2);
    }
  }

  var eqStartTime = 0;
  function startEq(){
    if(eqStartTime) return;
    eqStartTime = performance.now();
    tickEq();
  }

  function stopEq(){
    eqStartTime = 0;
    if(eqRAF){ cancelAnimationFrame(eqRAF); eqRAF = null; }
    bars.forEach(function(b){ b.style.height = "4px"; b.className = "eq__bar eq__bar--idle"; });
  }

  function tickEq(){
    if(!playing){ eqStartTime = 0; return; }
    var t = (performance.now() - eqStartTime) / 1000;
    bars.forEach(function(b, i){
      var val = amps[i] * (0.5 + 0.5 * Math.sin(t * freqs[i] + phases[i]));
      var h = 4 + val;
      b.style.height = Math.min(h, 44) + "px";
      b.className = "eq__bar";
    });
    eqRAF = requestAnimationFrame(tickEq);
  }

  /* ── progress bar seek ─────────────────────────────── */
  $prog.addEventListener("click", function(e){
    var rect = $prog.getBoundingClientRect();
    var pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    var s = songs[idx];
    currentSec = Math.floor(pct * s.total);
    var p = (currentSec / s.total * 100).toFixed(2);
    $fill.style.width = p + "%";
    $tCur.textContent = fmt(currentSec);
    $prog.setAttribute("aria-valuenow", p);
  });

  /* ── control buttons ───────────────────────────────── */
  $playBtn.addEventListener("click", toggle);

  document.getElementById("prevBtn").addEventListener("click", function(){
    setSong(idx > 0 ? idx - 1 : songs.length - 1);
    if(playing) play();
  });

  document.getElementById("nextBtn").addEventListener("click", function(){
    setSong(idx < songs.length - 1 ? idx + 1 : 0);
    if(playing) play();
  });

  /* ── keyboard ──────────────────────────────────────── */
  document.addEventListener("keydown", function(e){
    if(e.target.tagName === "INPUT") return;
    if(e.code === "Space"){ e.preventDefault(); toggle(); }
    if(e.code === "ArrowRight"){ e.preventDefault(); setSong(idx < songs.length - 1 ? idx + 1 : 0); }
    if(e.code === "ArrowLeft"){ e.preventDefault(); setSong(idx > 0 ? idx - 1 : songs.length - 1); }
  });

  /* ── init ──────────────────────────────────────────── */
  initEq();
  setSong(0);
  renderQueue();

})();
</script>
</body>
</html>
